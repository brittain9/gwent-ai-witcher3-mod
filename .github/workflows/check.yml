name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/check_public_tree.py
      - run: uv sync --frozen
      - run: uvx ruff==0.17.3 check scripts learning w3gwent tests
      - run: uvx ruff==0.17.3 format --check scripts learning w3gwent tests
      - run: uv run python -m unittest discover -s tests
      - run: node mod/ai/node/mod.test.js
